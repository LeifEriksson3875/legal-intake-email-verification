[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-intake-email-verification"
version = "0.1.0"
description = "Typed legal intake service that sends verification, signed document, and deadline emails."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic[email]>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
